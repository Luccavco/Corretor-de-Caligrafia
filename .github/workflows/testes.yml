name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Fontes dos moldes (DejaVu, Liberation, Noto)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fontconfig fonts-dejavu-core fonts-liberation fonts-noto-core

      - name: Dependências (torch CPU, sem CUDA)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          pip install opencv-python-headless numpy pillow fastapi python-multipart httpx

      - name: Modelo treinado (do pacote da release v1.0.0)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.0 --pattern "Calligraphos-*-linux.zip" --output pacote.zip
          unzip -q -j pacote.zip "*/modelo_caligrafia.pth" -d .
          ls -la modelo_caligrafia.pth

      - name: Testes
        env:
          CI: "true"
        run: |
          python tests/test_letra_prep.py
          python tests/test_formacao.py
          python tests/test_avaliador.py
          python tests/test_api.py
